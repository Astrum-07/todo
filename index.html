<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To-Do List — Elegant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-Do List</h1>
      <p class="subtitle">Vazifalarni qo'shing, tahrir qiling yoki o'chiring — va bajarganingizga chizgi torting ✨</p>
    </header>

    <section class="input-area">
      <form id="task-form" autocomplete="off">
        <input id="task-input" type="text" placeholder="Yangi vazifa yozing..." maxlength="200" />
        <button type="submit" class="btn add-btn">Qo'shish</button>
      </form>
    </section>


    <ul id="task-list" class="task-list" aria-label="Vazifalar ro'yxati"></ul>

 
  </main>

  <script src="script.js"></script>
</body>
</html>
